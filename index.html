<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلب جليدي 💙❄️</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e3a8a, #0f172a 45%, #020617 100%);
            --ice-glass: rgba(224, 242, 254, 0.08);
            --ice-glass-heavy: rgba(15, 23, 42, 0.72);
            --ice-border: rgba(186, 230, 253, 0.35);
            --ice-highlight: rgba(255, 255, 255, 0.18);
            --ice-accent: #38bdf8;
            --ice-cyan: #7dd3fc;
            --ice-glow: 0 0 20px rgba(56, 189, 248, 0.45), inset 0 0 12px rgba(255, 255, 255, 0.12);
            --text-main: #f0f9ff;
            --text-muted: #bae6fd;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* تأثير الثلج المتساقط في الخلفية */
        .snowflakes {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(224, 242, 254, 0.45);
            font-size: 1rem;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        /* شاشة تسجيل الدخول */
        #auth-screen {
            position: relative;
            z-index: 1;
            background: var(--ice-glass);
            backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid var(--ice-border);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            padding: 40px;
            border-radius: 28px;
            width: 90%;
            max-width: 410px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), var(--ice-glow);
        }

        .logo {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #ffffff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border-radius: 14px;
            border: 1px solid var(--ice-border);
            background: rgba(15, 23, 42, 0.55);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--ice-accent);
            box-shadow: var(--ice-glow);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--ice-glow);
        }

        /* واجهة التطبيق الرئيسية */
        #app-screen {
            position: relative;
            z-index: 1;
            display: none;
            width: 96%;
            max-width: 1150px;
            height: 92vh;
            background: var(--ice-glass);
            backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--ice-border);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), inset 0 0 25px rgba(186, 230, 253, 0.1);
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 360px;
            border-left: 1px solid var(--ice-border);
            display: flex;
            flex-direction: column;
            background: rgba(9, 21, 38, 0.55);
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--ice-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--ice-accent);
            background: linear-gradient(135deg, #0ea5e9, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-box {
            padding: 14px;
            border-bottom: 1px solid var(--ice-border);
            display: flex;
            gap: 8px;
        }

        .search-box input { margin-bottom: 0; padding: 8px 12px; }
        .search-box button { width: auto; padding: 8px 16px; }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .user-item {
            padding: 11px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--ice-border);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }

        .add-btn {
            width: auto;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            display: flex;
            border-top: 1px solid var(--ice-border);
            background: rgba(6, 16, 30, 0.85);
            padding: 6px;
            gap: 6px;
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            box-shadow: none;
            padding: 8px 4px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-btn:hover { transform: none; background: rgba(255, 255, 255, 0.06); }
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.45), rgba(56, 189, 248, 0.25));
            border-color: var(--ice-border);
            color: #fff;
            box-shadow: var(--ice-glow);
        }

        /* قسم الحالات */
        .status-card {
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .status-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-word;
        }
        .color-picker-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.selected { border-color: #fff; transform: scale(1.15); }

        /* منطقة المحادثة */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.25);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--ice-border);
            background: rgba(9, 21, 38, 0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .action-pill {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--ice-border);
            box-shadow: none;
        }
        .action-pill.danger { color: #fca5a5; border-color: rgba(248, 113, 113, 0.4); }
        .action-pill.danger:hover { background: rgba(239, 68, 68, 0.25); }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 72%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.45;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .msg.sent {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.85), rgba(56, 189, 248, 0.75));
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
        }

        .msg.received {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--ice-border);
            border-bottom-left-radius: 4px;
        }

        .msg.deleted {
            font-style: italic;
            opacity: 0.65;
            background: rgba(15, 23, 42, 0.5);
        }

        .msg-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            margin-top: 4px;
            color: rgba(240, 249, 255, 0.85);
        }

        .read-badge { color: #e0f2fe; font-weight: 700; text-shadow: 0 0 6px #fff; }

        .msg-menu-btn {
            position: absolute;
            top: 6px;
            left: 8px;
            background: rgba(0, 0, 0, 0.25);
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.75rem;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }

        .msg.sent:not(.deleted):hover .msg-menu-btn { display: flex; }

        .msg-dropdown {
            position: absolute;
            top: 30px;
            left: 8px;
            background: rgba(9, 21, 38, 0.95);
            border: 1px solid var(--ice-border);
            border-radius: 12px;
            padding: 4px;
            z-index: 20;
            min-width: 135px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .msg-dropdown div {
            padding: 7px 10px;
            font-size: 0.82rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .msg-dropdown div:hover { background: rgba(56, 189, 248, 0.25); }

        .chat-input-area {
            padding: 14px 20px;
            border-top: 1px solid var(--ice-border);
            display: flex;
            gap: 10px;
            background: rgba(9, 21, 38, 0.5);
        }
        .chat-input-area input { margin-bottom: 0; }
        .chat-input-area button { width: 110px; }

        .section-title {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 8px 4px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            #app-screen { flex-direction: column; height: 96vh; }
            .sidebar { width: 100%; height: 48%; border-left: none; border-bottom: 1px solid var(--ice-border); }
            .chat-area { height: 52%; }
        }

        /* إضافات: شاشات اللمس + ارتفاع الشاشة الحقيقي */
        @media (hover: none) {
            .msg.sent:not(.deleted) .msg-menu-btn { display: flex; }
        }
        body { height: 100dvh; }
        #app-screen { height: 92dvh; }
        @media (max-width: 768px) { #app-screen { height: 96dvh; } }
    </style>
</head>
<body>

    <div class="snowflakes" id="snow-container"></div>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen">
        <div class="logo">قلب جليدي 💙❄️</div>
        <p class="subtitle">أدخل اسم المستخدم وكلمة المرور للدخول إلى عالم الجليد</p>
        <input type="text" id="username-input" placeholder="اسم المستخدم...">
        <input type="password" id="password-input" placeholder="كلمة المرور...">
        <button onclick="login()">دخول ❄️</button>
        <p id="auth-error" style="color: #fca5a5; margin-top: 12px; font-size: 0.9rem;"></p>
    </div>

    <!-- واجهة التطبيق -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <span style="font-weight: 800; font-size: 1.1rem;">قلب جليدي 💙</span>
                <div class="user-profile-mini">
                    <span id="current-user-badge" style="color: var(--ice-cyan); font-size: 0.9rem; font-weight: 600;"></span>
                    <div id="my-header-avatar" class="avatar" style="width: 34px; height: 34px; font-size: 0.85rem;"></div>
                </div>
            </div>

            <!-- 1. تبويب الأصدقاء -->
            <div id="tab-friends" class="tab-content">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="ابحث عن صديق بالاسم...">
                    <button onclick="searchUsers()">بحث</button>
                </div>
                <div class="list-container">
                    <div id="search-results-section" style="display: none;">
                        <div class="section-title">نتائج البحث:</div>
                        <div id="search-results"></div>
                    </div>
                    <div class="section-title">الأصدقاء:</div>
                    <div id="friends-list"></div>
                </div>
            </div>

            <!-- 2. تبويب الحالات (24 ساعة) -->
            <div id="tab-statuses" class="tab-content" style="display: none;">
                <div class="list-container">
                    <div class="section-title">أضف حالة نصية (تختفي بعد 24 ساعة) ❄️</div>
                    <textarea id="status-input" rows="2" placeholder="اكتب حالتك الجليدية هنا..."></textarea>
                    <div class="color-picker-row">
                        <div class="color-dot selected" style="background: linear-gradient(135deg, #0284c7, #1e3a8a);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #0284c7, #1e3a8a)')"></div>
                        <div class="color-dot" style="background: linear-gradient(135deg, #0f766e, #0e7490);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #0f766e, #0e7490)')"></div>
                        <div class="color-dot" style="background: linear-gradient(135deg, #4338ca, #312e81);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #4338ca, #312e81)')"></div>
                        <div class="color-dot" style="background: linear-gradient(135deg, #1e293b, #334155);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #1e293b, #334155)')"></div>
                    </div>
                    <button onclick="postStatus()" style="margin-bottom: 16px;">نشر الحالة ✨</button>
                    <div class="section-title">حالات الأصدقاء وحالاتي:</div>
                    <div id="statuses-list"></div>
                </div>
            </div>

            <!-- 3. تبويب الإعدادات -->
            <div id="tab-settings" class="tab-content" style="display: none;">
                <div class="list-container">
                    <div class="section-title">إعدادات الحساب الجليدي ⚙️</div>
                    <div style="text-align: center; margin: 15px 0;">
                        <div id="settings-avatar-preview" class="avatar" style="width: 80px; height: 80px; font-size: 1.8rem; margin: 0 auto 10px;"></div>
                        <label style="display: inline-block; padding: 6px 14px; background: rgba(56, 189, 248, 0.2); border: 1px solid var(--ice-border); border-radius: 10px; cursor: pointer; font-size: 0.85rem;">
                            تغيير صورة الحساب 📷
                            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
                        </label>
                    </div>
                    <div class="section-title">تغيير اسم المستخدم:</div>
                    <input type="text" id="new-username-input" placeholder="اسم المستخدم الجديد...">
                    <button onclick="saveSettings()">حفظ التعديلات 💾</button>
                    <button onclick="logout()" style="margin-top: 10px; background: rgba(255,255,255,0.08);">تسجيل الخروج 🚪</button>
                    <p id="settings-msg" style="margin-top: 10px; font-size: 0.85rem; text-align: center;"></p>
                </div>
            </div>

            <!-- الخيارات بالأسفل -->
            <div class="bottom-nav">
                <button class="nav-btn active" id="nav-friends" onclick="switchTab('friends')">
                    <span>💬</span><span>الأصدقاء</span>
                </button>
                <button class="nav-btn" id="nav-statuses" onclick="switchTab('statuses')">
                    <span>❄️</span><span>الحالات</span>
                </button>
                <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
                    <span>⚙️</span><span>الإعدادات</span>
                </button>
            </div>
        </div>

        <!-- منطقة المحادثة -->
        <div class="chat-area">
            <div class="chat-header" id="chat-header">
                <span>اختر صديقاً لبدء المحادثة ❄️</span>
            </div>
            <div class="messages-box" id="messages-box"></div>
            <div id="blocked-banner" style="display: none; padding: 12px; text-align: center; background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-size: 0.9rem;">
                تم حظر هذه المحادثة. لا يمكن إرسال رسائل.
            </div>
            <div class="chat-input-area" id="input-area" style="display: none;">
                <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">إرسال ❄️</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:5000';
        let socket = null;
        let currentUser = "";
        let currentAvatar = "";
        let activeFriend = "";
        let pendingAvatar = null;
        let statusBg = 'linear-gradient(135deg, #0284c7, #1e3a8a)';
        let messagesCache = [];
        let blockedByMe = false, blockedMe = false;
        let friendsCache = [];
        const unread = {};

        const $ = id => document.getElementById(id);

        async function postJSON(path, body) {
            const r = await fetch(SERVER_URL + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return r.json();
        }
        async function getJSON(path) {
            const r = await fetch(SERVER_URL + path);
            return r.json();
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function paintAvatar(node, name, avatar) {
            if (avatar) {
                node.textContent = '';
                node.style.backgroundImage = 'url("' + avatar + '")';
                node.style.backgroundSize = 'cover';
                node.style.backgroundPosition = 'center';
            } else {
                node.style.backgroundImage = '';
                node.textContent = (name || '?').charAt(0).toUpperCase();
            }
        }

        function makeAvatar(name, avatar, size) {
            const a = el('div', 'avatar');
            a.style.width = a.style.height = size + 'px';
            a.style.fontSize = Math.round(size * 0.42) + 'px';
            paintAvatar(a, name, avatar);
            return a;
        }

        /* ───── الثلج ───── */
        (function snow() {
            const box = $('snow-container');
            for (let i = 0; i < 35; i++) {
                const s = el('div', 'snowflake', '❄');
                s.style.left = Math.random() * 100 + '%';
                s.style.fontSize = (0.6 + Math.random() * 1.1) + 'rem';
                s.style.animationDuration = (7 + Math.random() * 11) + 's';
                s.style.animationDelay = (-Math.random() * 15) + 's';
                box.appendChild(s);
            }
        })();

        /* ───── تسجيل الدخول ───── */
        async function login() {
            const u = $('username-input').value.trim();
            const p = $('password-input').value.trim();
            const errBox = $('auth-error');
            errBox.textContent = '';
            if (!u || !p) { errBox.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور'; return; }
            try {
                const d = await postJSON('/auth', { username: u, password: p });
                if (d.status !== 'success') { errBox.textContent = d.message || 'حدث خطأ'; return; }
                currentUser = d.username;
                currentAvatar = d.avatar || '';
                localStorage.setItem('icy_last_user', currentUser);
                enterApp();
            } catch (e) {
                errBox.textContent = 'تعذّر الاتصال بالسيرفر. تأكد أنه شغّال.';
            }
        }

        function logout() {
            if (socket) socket.disconnect();
            socket = null;
            currentUser = ""; activeFriend = ""; messagesCache = [];
            $('app-screen').style.display = 'none';
            $('auth-screen').style.display = 'block';
            $('password-input').value = '';
            resetChatArea();
        }

        function enterApp() {
            $('auth-screen').style.display = 'none';
            $('app-screen').style.display = 'flex';
            $('current-user-badge').textContent = currentUser;
            paintAvatar($('my-header-avatar'), currentUser, currentAvatar);
            paintAvatar($('settings-avatar-preview'), currentUser, currentAvatar);
            $('new-username-input').value = currentUser;
            connectSocket();
            switchTab('friends');
            loadFriends();
        }

        /* ───── Socket.IO ───── */
        function connectSocket() {
            if (socket) socket.disconnect();
            socket = io(SERVER_URL);
            socket.on('connect', () => socket.emit('join', { username: currentUser }));

            socket.on('receive_message', m => {
                const involvesActive = activeFriend && (m.sender === activeFriend || m.receiver === activeFriend);
                if (involvesActive) {
                    if (!messagesCache.some(x => x.id === m.id)) messagesCache.push(m);
                    renderMessages(true);
                    if (m.sender === activeFriend) {
                        socket.emit('mark_read', { sender: activeFriend, receiver: currentUser });
                    }
                } else if (m.receiver === currentUser) {
                    unread[m.sender] = true;
                    if (!friendsCache.some(f => f.username === m.sender)) loadFriends();
                    else renderFriends();
                }
            });

            socket.on('messages_read', d => {
                if (d.by === activeFriend) {
                    messagesCache.forEach(m => { if (m.sender === currentUser) m.is_read = 1; });
                    renderMessages(false);
                }
            });

            socket.on('message_updated', d => {
                const m = messagesCache.find(x => x.id === d.id);
                if (m) { Object.assign(m, d); renderMessages(false); }
            });

            socket.on('message_removed', d => {
                messagesCache = messagesCache.filter(x => x.id !== d.id);
                renderMessages(false);
            });
        }

        /* ───── التبويبات ───── */
        function switchTab(name) {
            ['friends', 'statuses', 'settings'].forEach(t => {
                $('tab-' + t).style.display = (t === name) ? 'flex' : 'none';
                $('nav-' + t).classList.toggle('active', t === name);
            });
            if (name === 'friends') loadFriends();
            if (name === 'statuses') loadStatuses();
        }

        /* ───── الأصدقاء والبحث ───── */
        async function loadFriends() {
            try {
                const d = await getJSON('/friends?user=' + encodeURIComponent(currentUser));
                friendsCache = d.friends || [];
                renderFriends();
            } catch (e) { /* تجاهل */ }
        }

        function renderFriends() {
            const box = $('friends-list');
            box.textContent = '';
            if (!friendsCache.length) {
                box.appendChild(el('div', 'section-title', 'ما عندك أصدقاء بعد. ابحث عن اسم وأضفه ❄️'));
                return;
            }
            friendsCache.forEach(f => {
                const row = el('div', 'user-item' + (f.username === activeFriend ? ' active' : ''));
                const left = el('div');
                left.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:0';
                left.appendChild(makeAvatar(f.username, f.avatar, 38));
                left.appendChild(el('span', '', f.username));
                row.appendChild(left);
                if (unread[f.username]) {
                    const dot = el('span');
                    dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8;flex-shrink:0';
                    row.appendChild(dot);
                }
                row.addEventListener('click', () => openChat(f.username));
                box.appendChild(row);
            });
        }

        async function searchUsers() {
            const q = $('search-input').value.trim();
            const section = $('search-results-section');
            const box = $('search-results');
            if (!q) { section.style.display = 'none'; return; }
            try {
                const d = await getJSON('/search?q=' + encodeURIComponent(q) + '&user=' + encodeURIComponent(currentUser));
                box.textContent = '';
                section.style.display = 'block';
                if (!d.users.length) { box.appendChild(el('div', 'section-title', 'لا توجد نتائج')); return; }
                d.users.forEach(name => {
                    const row = el('div', 'user-item');
                    row.style.cursor = 'default';
                    row.appendChild(el('span', '', name));
                    const isFriend = friendsCache.some(f => f.username === name);
                    const b = el('button', 'add-btn', isFriend ? 'صديق ✓' : 'إضافة ➕');
                    if (isFriend) { b.disabled = true; b.style.opacity = '0.6'; }
                    b.addEventListener('click', () => addFriend(name));
                    row.appendChild(b);
                    box.appendChild(row);
                });
            } catch (e) { /* تجاهل */ }
        }

        async function addFriend(name) {
            const d = await postJSON('/add_friend', { user: currentUser, friend: name });
            if (d.status === 'success') {
                $('search-input').value = '';
                $('search-results-section').style.display = 'none';
                loadFriends();
            }
        }

        /* ───── المحادثة ───── */
        function resetChatArea() {
            $('chat-header').textContent = '';
            $('chat-header').appendChild(el('span', '', 'اختر صديقاً لبدء المحادثة ❄️'));
            $('messages-box').textContent = '';
            $('input-area').style.display = 'none';
            $('blocked-banner').style.display = 'none';
        }

        async function openChat(friend) {
            activeFriend = friend;
            unread[friend] = false;
            renderFriends();
            renderChatHeader();
            await loadMessages();
            $('msg-input').focus();
        }

        function renderChatHeader() {
            const h = $('chat-header');
            h.textContent = '';
            const f = friendsCache.find(x => x.username === activeFriend) || {};
            const who = el('div');
            who.style.cssText = 'display:flex;align-items:center;gap:10px';
            who.appendChild(makeAvatar(activeFriend, f.avatar, 38));
            who.appendChild(el('strong', '', activeFriend));
            h.appendChild(who);

            const actions = el('div', 'chat-actions');
            const clear = el('button', 'action-pill', 'مسح المحادثة 🧹');
            clear.addEventListener('click', clearChat);
            const block = el('button', 'action-pill danger', blockedByMe ? 'إلغاء الحظر ✅' : 'حظر 🚫');
            block.addEventListener('click', toggleBlock);
            actions.appendChild(clear);
            actions.appendChild(block);
            h.appendChild(actions);
        }

        async function loadMessages() {
            const d = await getJSON('/messages?u1=' + encodeURIComponent(currentUser) + '&u2=' + encodeURIComponent(activeFriend));
            messagesCache = d.messages || [];
            blockedByMe = !!d.blocked_by_me;
            blockedMe = !!d.blocked_me;
            renderChatHeader();
            updateBlockedUI();
            renderMessages(true);
            if (messagesCache.some(m => m.sender === activeFriend && !m.is_read)) {
                socket.emit('mark_read', { sender: activeFriend, receiver: currentUser });
            }
        }

        function updateBlockedUI() {
            const blocked = blockedByMe || blockedMe;
            $('blocked-banner').style.display = blocked ? 'block' : 'none';
            $('input-area').style.display = blocked ? 'none' : 'flex';
            $('blocked-banner').textContent = blockedByMe
                ? 'لقد حظرت هذا المستخدم. لا يمكن إرسال رسائل.'
                : 'تم حظر هذه المحادثة. لا يمكن إرسال رسائل.';
        }

        function closeMenus() {
            document.querySelectorAll('.msg-dropdown').forEach(d => d.remove());
        }
        document.addEventListener('click', closeMenus);

        function renderMessages(scrollDown) {
            const box = $('messages-box');
            const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
            box.textContent = '';
            messagesCache.forEach(m => {
                const mine = m.sender === currentUser;
                const deleted = !!m.deleted_for_all;
                const div = el('div', 'msg ' + (mine ? 'sent' : 'received') + (deleted ? ' deleted' : ''));
                div.appendChild(el('div', '', deleted ? '🚫 تم حذف هذه الرسالة' : m.text));

                const meta = el('div', 'msg-meta');
                if (m.edited && !deleted) meta.appendChild(el('span', '', '(معدّلة)'));
                if (mine && !deleted) {
                    meta.appendChild(el('span', m.is_read ? 'read-badge' : '', m.is_read ? '✓✓' : '✓'));
                }
                div.appendChild(meta);

                if (mine && !deleted) {
                    const btn = el('button', 'msg-menu-btn', '⋮');
                    btn.addEventListener('click', ev => {
                        ev.stopPropagation();
                        const had = div.querySelector('.msg-dropdown');
                        closeMenus();
                        if (had) return;
                        const dd = el('div', 'msg-dropdown');
                        const items = [
                            ['تعديل ✏️', () => editMessage(m)],
                            ['حذف عندي 🙈', () => deleteMessage(m, 'me')],
                            ['حذف عند الجميع 🗑️', () => deleteMessage(m, 'everyone')]
                        ];
                        items.forEach(([label, fn]) => {
                            const it = el('div', '', label);
                            it.addEventListener('click', e2 => { e2.stopPropagation(); closeMenus(); fn(); });
                            dd.appendChild(it);
                        });
                        div.appendChild(dd);
                    });
                    div.appendChild(btn);
                }
                box.appendChild(div);
            });
            if (scrollDown || nearBottom) box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            const input = $('msg-input');
            const text = input.value.trim();
            if (!text || !activeFriend || blockedByMe || blockedMe) return;
            socket.emit('send_message', { sender: currentUser, receiver: activeFriend, text });
            input.value = '';
            input.focus();
        }

        function editMessage(m) {
            const t = prompt('تعديل الرسالة:', m.text);
            if (t === null) return;
            const text = t.trim();
            if (!text || text === m.text) return;
            socket.emit('edit_message', { id: m.id, text, sender: currentUser, receiver: activeFriend });
        }

        function deleteMessage(m, mode) {
            if (mode === 'everyone' && !confirm('حذف هذه الرسالة عند الجميع؟')) return;
            socket.emit('delete_message', { id: m.id, mode, user: currentUser, friend: activeFriend });
        }

        async function clearChat() {
            if (!activeFriend || !confirm('مسح كل رسائل هذه المحادثة عندك؟')) return;
            await postJSON('/clear_chat', { user: currentUser, friend: activeFriend });
            loadMessages();
        }

        async function toggleBlock() {
            if (!activeFriend) return;
            const msg = blockedByMe ? 'إلغاء حظر ' + activeFriend + '؟' : 'حظر ' + activeFriend + '؟';
            if (!confirm(msg)) return;
            await postJSON('/toggle_block', { user: currentUser, friend: activeFriend });
            loadMessages();
        }

        /* ───── الحالات ───── */
        function selectStatusBg(node, bg) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            node.classList.add('selected');
            statusBg = bg;
        }

        async function postStatus() {
            const input = $('status-input');
            const text = input.value.trim();
            if (!text) return;
            const d = await postJSON('/statuses', { user: currentUser, text, bg_color: statusBg });
            if (d.status === 'success') { input.value = ''; loadStatuses(); }
            else alert(d.message || 'تعذّر نشر الحالة');
        }

        async function loadStatuses() {
            const box = $('statuses-list');
            try {
                const d = await getJSON('/statuses?user=' + encodeURIComponent(currentUser));
                box.textContent = '';
                if (!d.statuses.length) {
                    box.appendChild(el('div', 'section-title', 'لا توجد حالات بعد. انشر أول حالة ❄️'));
                    return;
                }
                d.statuses.forEach(s => {
                    const card = el('div', 'status-card');
                    card.style.background = s.bg_color;
                    const head = el('div', 'status-header');
                    head.appendChild(makeAvatar(s.username, s.avatar, 28));
                    head.appendChild(el('span', '', s.username === currentUser ? 'أنت' : s.username));
                    head.appendChild(el('span', '', '· باقي ' + s.hours_left + ' ساعة'));
                    card.appendChild(head);
                    card.appendChild(el('div', 'status-text', s.text));
                    box.appendChild(card);
                });
            } catch (e) { /* تجاهل */ }
        }

        /* ───── الإعدادات ───── */
        function previewAvatar(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const size = 256;
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const side = Math.min(img.width, img.height);
                    ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
                    pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                    paintAvatar($('settings-avatar-preview'), currentUser, pendingAvatar);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        async function saveSettings() {
            const msg = $('settings-msg');
            const newName = $('new-username-input').value.trim() || currentUser;
            msg.style.color = '';
            try {
                const d = await postJSON('/update_profile', {
                    old_username: currentUser,
                    new_username: newName,
                    avatar: pendingAvatar
                });
                if (d.status !== 'success') {
                    msg.style.color = '#fca5a5';
                    msg.textContent = d.message || 'حدث خطأ';
                    return;
                }
                const renamed = d.username !== currentUser;
                currentUser = d.username;
                currentAvatar = d.avatar || '';
                pendingAvatar = null;
                localStorage.setItem('icy_last_user', currentUser);
                $('current-user-badge').textContent = currentUser;
                paintAvatar($('my-header-avatar'), currentUser, currentAvatar);
                paintAvatar($('settings-avatar-preview'), currentUser, currentAvatar);
                if (renamed && socket) socket.emit('join', { username: currentUser });
                msg.style.color = '#7dd3fc';
                msg.textContent = 'تم الحفظ ✅';
                loadFriends();
            } catch (e) {
                msg.style.color = '#fca5a5';
                msg.textContent = 'تعذّر الاتصال بالسيرفر';
            }
        }

        /* ───── بدء الصفحة ───── */
        $('username-input').value = localStorage.getItem('icy_last_user') || '';
        $('password-input').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
        $('username-input').addEventListener('keypress', e => { if (e.key === 'Enter') $('password-input').focus(); });
        $('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') searchUsers(); });
    </script>
</body>
</html>
