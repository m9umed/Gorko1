<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلب جليدي 💙❄️</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e3a8a, #0f172a 45%, #020617 100%);
            --ice-glass: rgba(224, 242, 254, 0.08);
            --ice-glass-heavy: rgba(15, 23, 42, 0.72);
            --ice-border: rgba(186, 230, 253, 0.35);
            --ice-highlight: rgba(255, 255, 255, 0.18);
            --ice-accent: #38bdf8;
            --ice-cyan: #7dd3fc;
            --ice-glow: 0 0 20px rgba(56, 189, 248, 0.45), inset 0 0 12px rgba(255, 255, 255, 0.12);
            --text-main: #f0f9ff;
            --text-muted: #bae6fd;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .snowflakes {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(224, 242, 254, 0.45);
            font-size: 1rem;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        #auth-screen {
            position: relative;
            z-index: 1;
            background: var(--ice-glass);
            backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid var(--ice-border);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            padding: 40px;
            border-radius: 28px;
            width: 90%;
            max-width: 410px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), var(--ice-glow);
        }

        .logo {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #ffffff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border-radius: 14px;
            border: 1px solid var(--ice-border);
            background: rgba(15, 23, 42, 0.55);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--ice-accent);
            box-shadow: var(--ice-glow);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--ice-glow);
        }

        #app-screen {
            position: relative;
            z-index: 1;
            display: none;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: var(--ice-glass);
            backdrop-filter: blur(24px) saturate(150%);
            overflow: hidden;
        }

        .sidebar {
            width: 360px;
            flex-shrink: 0;
            border-left: 1px solid var(--ice-border);
            display: flex;
            flex-direction: column;
            background: rgba(9, 21, 38, 0.55);
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--ice-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--ice-accent);
            background: linear-gradient(135deg, #0ea5e9, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-box {
            padding: 14px;
            border-bottom: 1px solid var(--ice-border);
            display: flex;
            gap: 8px;
        }

        .search-box input { margin-bottom: 0; padding: 8px 12px; }
        .search-box button { width: auto; padding: 8px 16px; }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .user-item {
            padding: 11px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--ice-border);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }

        .add-btn {
            width: auto;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        .bottom-nav {
            display: flex;
            border-top: 1px solid var(--ice-border);
            background: rgba(6, 16, 30, 0.85);
            padding: 6px;
            gap: 6px;
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            box-shadow: none;
            padding: 8px 4px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-btn:hover { transform: none; background: rgba(255, 255, 255, 0.06); }
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.45), rgba(56, 189, 248, 0.25));
            border-color: var(--ice-border);
            color: #fff;
            box-shadow: var(--ice-glow);
        }

        .status-card {
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .status-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-word;
        }
        .color-picker-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.selected { border-color: #fff; transform: scale(1.15); }

        .chat-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.25);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--ice-border);
            background: rgba(9, 21, 38, 0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .chat-who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .chat-who strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .back-btn {
            display: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.3rem;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--ice-border);
            box-shadow: none;
        }
        .back-btn:hover { transform: none; }

        .viewers-btn {
            width: auto;
            margin-top: 10px;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }
        .viewers-list {
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 4px 12px;
        }
        .viewer-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 0.85rem; }

        #avatar-viewer {
            display: none;
        <script>
        const SERVER_URL = location.origin || 'https://gorko1.onrender.com';
        let socket = null;
        let currentUser = "";
        let currentAvatar = "";
        let activeFriend = "";
        let pendingAvatar = null;
        let statusBg = 'linear-gradient(135deg, #0284c7, #1e3a8a)';
        let messagesCache = [];
        let blockedByMe = false, blockedMe = false;
        let friendsCache = [];
        const unread = {};
        const viewedStatuses = new Set();
        let statusObserver = null;
        let chatHistoryPushed = false;

        const $ = id => document.getElementById(id);

        function showAuthMsg(msg, color) {
            const box = $('auth-error');
            if (!box) return;
            box.style.color = color || '#fca5a5';
            box.textContent = msg;
        }

        async function postJSON(path, body) {
            const r = await fetch(SERVER_URL + path, {
                method: 'POST',
                cache: 'no-store',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const text = await r.text();
            try {
                return JSON.parse(text);
            } catch (_) {
                return { status: 'error', message: 'رد غير متوقع (' + r.status + '): ' + text.slice(0, 120) };
            }
        }

        async function getJSON(path) {
            const r = await fetch(SERVER_URL + path, { cache: 'no-store' });
            const text = await r.text();
            return JSON.parse(text);
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function paintAvatar(node, name, avatar) {
            if (!node) return;
            if (avatar) {
                node.textContent = '';
                node.style.backgroundImage = 'url("' + avatar + '")';
                node.style.backgroundSize = 'cover';
                node.style.backgroundPosition = 'center';
            } else {
                node.style.backgroundImage = '';
                node.textContent = (name || '?').charAt(0).toUpperCase();
            }
        }

        function makeAvatar(name, avatar, size, zoom) {
            const a = el('div', 'avatar');
            a.style.width = a.style.height = size + 'px';
            a.style.fontSize = Math.round(size * 0.42) + 'px';
            paintAvatar(a, name, avatar);
            if (zoom) {
                a.style.cursor = 'pointer';
                a.addEventListener('click', e => { e.stopPropagation(); showAvatarBig(name, avatar); });
            }
            return a;
        }

        function showAvatarBig(name, avatar) {
            const box = $('avatar-viewer-img');
            const s = Math.min(320, window.innerWidth - 60);
            box.style.width = box.style.height = s + 'px';
            box.style.fontSize = Math.round(s * 0.4) + 'px';
            paintAvatar(box, name, avatar);
            $('avatar-viewer-name').textContent = name;
            $('avatar-viewer').style.display = 'flex';
        }

        (function snow() {
            const box = $('snow-container');
            if (!box) return;
            for (let i = 0; i < 35; i++) {
                const s = el('div', 'snowflake', '❄');
                s.style.left = Math.random() * 100 + '%';
                s.style.fontSize = (0.6 + Math.random() * 1.1) + 'rem';
                s.style.animationDuration = (7 + Math.random() * 11) + 's';
                s.style.animationDelay = (-Math.random() * 15) + 's';
                box.appendChild(s);
            }
        })();

        async function login() {
            const u = ($('username-input').value || '').trim();
            const p = ($('password-input').value || '').trim();
            const btn = $('login-btn');
            showAuthMsg('', '');
            if (!u || !p) {
                showAuthMsg('يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'جارٍ الدخول... ⏳';
            const timer = setTimeout(() => {
                showAuthMsg('السيرفر يستيقظ، انتظر قليلاً...', '#7dd3fc');
            }, 3500);
            try {
                const d = await postJSON('/auth', { username: u, password: p });
                if (d.status !== 'success') {
                    showAuthMsg(d.message || 'تعذّر تسجيل الدخول');
                    return;
                }
                currentUser = d.username;
                currentAvatar = d.avatar || '';
                try { localStorage.setItem('icy_last_user', currentUser); } catch (_) {}
                enterApp();
            } catch (e) {
                showAuthMsg('خطأ اتصال: ' + (e && e.message ? e.message : String(e)));
            } finally {
                clearTimeout(timer);
                btn.disabled = false;
                btn.textContent = 'دخول ❄️';
            }
        }

        function logout() {
            if (socket) { try { socket.disconnect(); } catch (_) {} }
            socket = null;
            currentUser = ""; activeFriend = ""; messagesCache = [];
            viewedStatuses.clear();
            chatHistoryPushed = false;
            $('app-screen').classList.remove('in-chat');$('app-screen').style.display = 'none';
            $('auth-screen').style.display = 'block';$('password-input').value = '';
            resetChatArea();
        }

        function enterApp() {
            $('auth-screen').style.display = 'none';$('app-screen').classList.remove('in-chat');
            $('app-screen').style.display = 'flex';$('current-user-badge').textContent = currentUser;
            paintAvatar($('my-header-avatar'), currentUser, currentAvatar);
            paintAvatar($('settings-avatar-preview'), currentUser, currentAvatar);$('new-username-input').value = currentUser;
            connectSocket();
            switchTab('friends');
            loadFriends();
        }

        function connectSocket() {
            if (socket) { try { socket.disconnect(); } catch (_) {} }
            if (typeof io === 'undefined') { socket = null; return; }
            socket = io(SERVER_URL, { transports: ['polling', 'websocket'], reconnection: true });
            socket.on('connect', () => socket.emit('join', { username: currentUser }));

            socket.on('receive_message', m => {
                const involvesActive = activeFriend && (m.sender === activeFriend || m.receiver === activeFriend);
                if (involvesActive) {
                    if (!messagesCache.some(x => x.id === m.id)) messagesCache.push(m);
                    renderMessages(true);
                    if (m.sender === activeFriend) {
                        socket.emit('mark_read', { sender: activeFriend, receiver: currentUser });
                    }
                } else if (m.receiver === currentUser) {
                    unread[m.sender] = true;
                    if (!friendsCache.some(f => f.username === m.sender)) loadFriends();
                    else renderFriends();
                }
            });

            socket.on('messages_read', d => {
                if (d.by === activeFriend) {
                    messagesCache.forEach(m => { if (m.sender === currentUser) m.is_read = 1; });
                    renderMessages(false);
                }
            });

            socket.on('message_updated', d => {
                const m = messagesCache.find(x => x.id === d.id);
                if (m) { Object.assign(m, d); renderMessages(false); }
            });

            socket.on('message_removed', d => {
                messagesCache = messagesCache.filter(x => x.id !== d.id);
                renderMessages(false);
            });
        }

        function switchTab(name) {
            ['friends', 'statuses', 'settings'].forEach(t => {
                $('tab-' + t).style.display = (t === name) ? 'flex' : 'none';$('nav-' + t).classList.toggle('active', t === name);
            });
            if (name === 'friends') loadFriends();
            if (name === 'statuses') loadStatuses();
        }

        async function loadFriends() {
            try {
                const d = await getJSON('/friends?user=' + encodeURIComponent(currentUser));
                friendsCache = d.friends || [];
                renderFriends();
            } catch (_) {}
        }

        function renderFriends() {
            const box = $('friends-list');
            box.textContent = '';
            if (!friendsCache.length) {
                box.appendChild(el('div', 'section-title', 'ما عندك أصدقاء بعد. ابحث عن اسم وأضفه ❄️'));
                return;
            }
            friendsCache.forEach(f => {
                const row = el('div', 'user-item' + (f.username === activeFriend ? ' active' : ''));
                const left = el('div');
                left.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:0';
                left.appendChild(makeAvatar(f.username, f.avatar, 38));
                left.appendChild(el('span', '', f.username));
                row.appendChild(left);
                if (unread[f.username]) {
                    const dot = el('span');
                    dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8;flex-shrink:0';
                    row.appendChild(dot);
                }
                row.addEventListener('click', () => openChat(f.username));
                box.appendChild(row);
            });
        }

        async function searchUsers() {
            const q = $('search-input').value.trim();
            const section = $('search-results-section');
            const box = $('search-results');
            if (!q) { section.style.display = 'none'; return; }
            try {
                const d = await getJSON('/search?q=' + encodeURIComponent(q) + '&user=' + encodeURIComponent(currentUser));
                box.textContent = '';
                section.style.display = 'block';
                if (!d.users.length) { box.appendChild(el('div', 'section-title', 'لا توجد نتائج')); return; }
                d.users.forEach(u => {
                    const name = u.username;
                    const row = el('div', 'user-item');
                    row.style.cursor = 'default';
                    const who = el('div');
                    who.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:0';
                    who.appendChild(makeAvatar(name, u.avatar, 38, true));
                    who.appendChild(el('span', '', name));
                    row.appendChild(who);
                    const isFriend = friendsCache.some(f => f.username === name);
                    const b = el('button', 'add-btn', isFriend ? 'صديق ✓' : 'إضافة ➕');
                    if (isFriend) { b.disabled = true; b.style.opacity = '0.6'; }
                    b.addEventListener('click', () => addFriend(name));
                    row.appendChild(b);
                    box.appendChild(row);
                });
            } catch (_) {}
        }

        async function addFriend(name) {
            const d = await postJSON('/add_friend', { user: currentUser, friend: name });
            if (d.status === 'success') {
                $('search-input').value = '';$('search-results-section').style.display = 'none';
                loadFriends();
            }
        }

        function resetChatArea() {
            $('chat-header').textContent = '';$('chat-header').appendChild(el('span', '', 'اختر صديقاً لبدء المحادثة ❄️'));
            $('messages-box').textContent = '';
            $('input-area').style.display = 'none';$('blocked-banner').style.display = 'none';
        }

        async function openChat(friend) {
            activeFriend = friend;
            unread[friend] = false;
            messagesCache = [];
            $('messages-box').textContent = '';$('app-screen').classList.add('in-chat');
            if (!chatHistoryPushed) {
                history.pushState({ chat: 1 }, '');
                chatHistoryPushed = true;
            }
            renderFriends();
            renderChatHeader();
            await loadMessages();
            if (window.innerWidth > 900) $('msg-input').focus();
        }

        function closeChat() {
            activeFriend = '';
            messagesCache = [];
            blockedByMe = blockedMe = false;
            $('app-screen').classList.remove('in-chat');
            resetChatArea();
            renderFriends();
            loadFriends();
        }

        function backToList() {
            if (chatHistoryPushed) history.back();
            else closeChat();
        }

        window.addEventListener('popstate', () => {
            chatHistoryPushed = false;
            if (activeFriend) closeChat();
        });

        function renderChatHeader() {
            const h = $('chat-header');
            h.textContent = '';

            const back = el('button', 'back-btn', '→');
            back.title = 'رجوع';
            back.addEventListener('click', backToList);
            h.appendChild(back);

            const f = friendsCache.find(x => x.username === activeFriend) || {};
            const who = el('div', 'chat-who');
            who.appendChild(makeAvatar(activeFriend, f.avatar, 38, true));
            who.appendChild(el('strong', '', activeFriend));
            h.appendChild(who);

            const actions = el('div', 'chat-actions');
            const clear = el('button', 'action-pill', 'مسح المحادثة 🧹');
