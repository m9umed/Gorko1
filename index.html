<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAMALES</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1321;--c:#162036;--c2:#1f2d4a;--t:#f1f4fb;--m:#8d9bbd;--a:#ffb703;--b:#ff5d73;--g:linear-gradient(135deg,#ffb703,#ff5d73)}
*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,Tahoma,sans-serif}
body{background:var(--bg);color:var(--t);min-height:100vh}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer;background:none}
input,textarea{background:var(--c2);border-radius:14px;padding:12px 14px;width:100%}
.mu{color:var(--m)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--c);border-radius:26px;padding:28px;display:grid;gap:12px;text-align:center}
.box h1,.logo{font-weight:800;letter-spacing:2px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.box h1{font-size:38px}
.tabs{display:flex;background:var(--c2);border-radius:14px;padding:4px}
.tabs button{flex:1;padding:9px;border-radius:11px;color:var(--m)}
.tabs .on{background:var(--g);color:#1a1200;font-weight:600}
.avp{width:92px;height:92px;border-radius:50%;background:var(--c2);margin:auto;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:28px;position:relative}
.avp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn{background:var(--g);color:#1a1200;font-weight:800;padding:12px 20px;border-radius:14px}
.btn2{background:var(--c2);padding:12px 20px;border-radius:14px}
.er{color:var(--b);min-height:20px;font-size:14px}
header{position:fixed;top:0;inset-inline:0;height:56px;background:#0d1321ee;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5;max-width:600px;margin:auto}
.logo{font-size:24px}
header div{display:flex;gap:6px}
header button{font-size:22px;position:relative;padding:6px 8px}
i.bd,header i{background:var(--b);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
header i{position:absolute;top:0;inset-inline-start:0}
i:empty{display:none}
main{max-width:600px;margin:auto;padding:68px 12px 90px}
nav{position:fixed;bottom:0;inset-inline:0;max-width:600px;margin:auto;background:#162036f2;backdrop-filter:blur(10px);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;z-index:5}
nav button{flex:1;display:grid;justify-items:center;font-size:21px;color:var(--m);padding:4px}
nav span{font-size:11px}
nav .on{color:var(--a)}
nav button[data-t=add]{font-size:26px;color:#1a1200}
nav button[data-t=add] b{background:var(--g);width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin-top:-18px;font-weight:600}
.card{background:var(--c);border-radius:20px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;cursor:pointer}
.row small{margin-inline-start:auto}
.fx{flex:1}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--g);color:#1a1200;display:grid;place-items:center;font-weight:800;flex:none}
.av.big{width:96px;height:96px;font-size:36px}
.tx{margin:10px 0;white-space:pre-wrap;line-height:1.7}
.md{width:100%;max-height:70vh;border-radius:14px;margin-top:8px;background:#000;object-fit:contain;display:block}
audio{width:100%;max-width:240px}
.acts{display:flex;gap:18px;margin-top:10px}
.acts button{font-size:16px;color:var(--m)}
.acts .lk{color:var(--b)}
.cms p{margin-top:8px;font-size:14px}
.in{display:flex;gap:8px;margin-top:10px}
.in button{color:var(--a);font-weight:600}
.ct{text-align:center;display:grid;gap:10px;background:linear-gradient(135deg,#1f2d4a,#162036)}
.ct div{display:flex;gap:10px}
.ct a{flex:1;padding:10px;border-radius:14px;color:#fff;text-decoration:none;font-weight:600}
.wa{background:#1fa855}.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}
textarea{min-height:120px;resize:vertical;margin:10px 0}
.fl{display:block;background:var(--c2);padding:12px;border-radius:14px;margin-bottom:12px;cursor:pointer}
.fl::after{content:attr(data-n);color:var(--a);margin-inline-start:8px}
.pf{text-align:center;display:grid;gap:10px;justify-items:center}
.st{display:flex;gap:22px;color:var(--m)}.st b{color:var(--t);display:block;font-size:18px}
.row2{display:flex;gap:8px}
.ttl{margin:6px 4px 12px}
.ch{display:grid;gap:8px}
.chh{position:sticky;top:56px;z-index:3}
#ms{display:grid;gap:8px;padding-bottom:70px}
.m{max-width:80%;background:var(--c2);padding:9px 12px;border-radius:16px 16px 16px 4px;justify-self:start;display:grid;gap:4px}
.m.me{background:var(--g);color:#1a1200;justify-self:end;border-radius:16px 16px 4px 16px}
.m small{font-size:11px;opacity:.7}
.m u{text-decoration:none;cursor:pointer;float:left}
.bar{position:fixed;bottom:0;inset-inline:0;max-width:600px;margin:auto;background:var(--c);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;z-index:6}
.bar button,.bar label{font-size:22px;padding:4px 6px;cursor:pointer}
.sh{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end}
.sh div{background:var(--c);width:100%;max-width:600px;margin:auto;border-radius:22px 22px 0 0;padding:12px;display:grid;gap:4px}
.sh button{padding:14px;border-radius:12px;background:var(--c2)}
</style>
</head>
<body>
<div id="auth" hidden>
 <div class="box">
  <h1>RAMALES</h1><p class="mu">شارك لحظاتك مع أصدقائك</p>
  <div class="tabs"><button id="tl" class="on" onclick="tab(0)">تسجيل الدخول</button><button id="tr" onclick="tab(1)">إنشاء حساب</button></div>
  <label class="avp" id="avl" hidden>📷<img id="avp" hidden><input type="file" id="aa" accept="image/*" hidden onchange="pv()"></label>
  <input id="em" type="email" placeholder="الإيميل" hidden>
  <input id="un" placeholder="اسم المستخدم أو الإيميل">
  <input id="pw" type="password" placeholder="كلمة المرور">
  <input id="pw2" type="password" placeholder="تأكيد كلمة المرور" hidden>
  <button class="btn" onclick="sub()">متابعة</button>
  <p id="er" class="er"></p>
 </div>
</div>
<div id="app" hidden>
 <header><b class="logo">RAMALES</b>
  <div><button onclick="go('notifs')">🔔<i id="bn"></i></button><button onclick="go('chats')">💬<i id="bm"></i></button></div></header>
 <main id="v"></main>
 <nav>
  <button data-t="home" onclick="go('home')">🏠<span>الرئيسية</span></button>
  <button data-t="add" onclick="go('add')"><b>＋</b></button>
  <button data-t="videos" onclick="go('videos')">🎬<span>فيديوهات</span></button>
  <button data-t="search" onclick="go('search')">🔍<span>بحث</span></button>
  <button data-t="me" onclick="go('profile',ME.username)">👤<span>حسابي</span></button>
 </nav>
</div>
<script>
const $=s=>document.querySelector(s);
let T=localStorage.t,ME,V='home',CH=0,CU,poll,reg=0,mr;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{o.headers={'X-Token':T||''};if(o.json){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
 const r=await fetch('/api'+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d};
const ago=t=>{const s=Date.now()/1000-t;return s<60?'الآن':s<3600?Math.floor(s/60)+' د':s<86400?Math.floor(s/3600)+' س':Math.floor(s/86400)+' يوم'};
const av=(u,c='')=>u.avatar?`<img class="av ${c}" src="${u.avatar}">`:`<div class="av ${c}">${esc(u.username[0])}</div>`;
const media=(m,t)=>!m?'':t=='image'?`<img class="md" src="${m}">`:t=='video'?`<video class="md" src="${m}" controls playsinline></video>`:t=='audio'?`<audio src="${m}" controls></audio>`:`<a href="${m}" target="_blank">📎 ملف</a>`;

/* ---- auth ---- */
function tab(r){reg=r;$('#tl').className=r?'':'on';$('#tr').className=r?'on':'';['#avl','#em','#pw2'].forEach(s=>$(s).hidden=!r);$('#un').placeholder=r?'اسم المستخدم':'اسم المستخدم أو الإيميل';$('#er').textContent=''}
function pv(){const f=$('#aa').files[0];if(f){$('#avp').src=URL.createObjectURL(f);$('#avp').hidden=false}}
async function sub(){const e=$('#er');e.textContent='';try{let d;
 if(reg){if($('#pw').value!=$('#pw2').value)return e.textContent='كلمتا المرور غير متطابقتين';
  const f=new FormData();f.append('email',$('#em').value);f.append('username',$('#un').value);f.append('password',$('#pw').value);if($('#aa').files[0])f.append('avatar',$('#aa').files[0]);
  d=await api('/register',{method:'POST',body:f})}
 else d=await api('/login',{method:'POST',json:{user:$('#un').value,password:$('#pw').value}});
 T=localStorage.t=d.token;boot()}catch(x){e.textContent=x.message}}
function out(){localStorage.removeItem('t');location.reload()}
async function boot(){if(!T){$('#auth').hidden=false;return}
 try{ME=await api('/me')}catch{return out()}
 $('#auth').hidden=true;$('#app').hidden=false;go('home');badges();setInterval(badges,5000)}
async function badges(){try{const b=await api('/badges');$('#bn').textContent=b.n||'';$('#bm').textContent=b.m||''}catch{}}

/* ---- views ---- */
async function go(v,a){V=v;clearInterval(poll);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==(v=='profile'&&a==ME.username?'me':v)));
 $('#v').innerHTML='<p class="mu">جاري التحميل...</p>';
 try{await R[v](a)}catch(e){$('#v').innerHTML=`<p class="mu">${esc(e.message)}</p>`}scrollTo(0,0)}
const post=p=>`<article class="card"><div class="row" onclick="go('profile','${p.user.username}')">${av(p.user)}<b>${esc(p.user.username)}</b><small class="mu">${ago(p.ts)}</small></div>
${p.text?`<p class="tx">${esc(p.text)}</p>`:''}${media(p.media,p.mtype)}
<div class="acts"><button onclick="like(${p.id},this)" class="${p.liked?'lk':''}">${p.liked?'❤️':'🤍'} <span>${p.likes}</span></button><button onclick="cm(${p.id})">💬 ${p.comments}</button></div><div class="cms" id="c${p.id}"></div></article>`;
const R={
 async home(){const l=await api('/feed');$('#v').innerHTML=`<section class="card ct"><b>تواصل مع مطوّري التطبيق RAMALES</b><div><a class="wa" href="https://wa.me/972567101138" target="_blank">واتساب</a><a class="ig" href="https://instagram.com/m_2007d_d" target="_blank">انستجرام</a></div></section>`+(l.map(post).join('')||'<p class="mu">لا يوجد منشورات بعد. كن أول من ينشر!</p>')},
 add(){$('#v').innerHTML=`<div class="card"><b>منشور جديد</b><textarea id="pt" placeholder="شو في بالك؟"></textarea><label class="fl">📷 إضافة صورة أو فيديو<input type="file" id="pf" accept="image/*,video/*" hidden onchange="this.parentNode.dataset.n=this.files[0]?this.files[0].name:''"></label><button class="btn" onclick="pub(this)">نشر</button></div>`},
 search(){$('#v').innerHTML=`<input id="sq" placeholder="ابحث عن شخص باسم المستخدم..." oninput="dq()" autofocus><div id="sr" style="margin-top:12px"></div>`;$('#sq').focus()},
 async videos(){const l=await api('/feed?type=video');$('#v').innerHTML=l.map(post).join('')||'<p class="mu">لا يوجد فيديوهات بعد</p>'},
 async profile(n){const u=await api('/user/'+encodeURIComponent(n)),l=await api('/feed?user='+u.id),m=u.id==ME.id;
  $('#v').innerHTML=`<div class="card pf">${av(u,'big')}<h2>${esc(u.username)}</h2><div class="st"><span><b>${u.posts}</b>منشور</span><span><b>${u.followers}</b>متابع</span><span><b>${u.following}</b>يتابع</span></div>
  ${m?'<button class="btn2" onclick="out()">تسجيل الخروج</button>':`<div class="row2"><button class="btn" onclick="fl(${u.id},'${u.username}')">${u.i_follow?'إلغاء المتابعة':'متابعة'}</button>${u.mutual?`<button class="btn2" onclick="go('chat',${u.id})">مراسلة</button>`:''}</div>`}</div>`+(l.map(post).join('')||'<p class="mu">لا يوجد منشورات</p>')},
 async notifs(){const l=await api('/notifs');$('#v').innerHTML='<h3 class="ttl">الإشعارات</h3>'+(l.map(n=>`<div class="card row" onclick="go('profile','${n.user.username}')">${av(n.user)}<div><b>${esc(n.user.username)}</b> ${n.kind=='follow'?'بدأ بمتابعتك. تابعه بالمقابل لتبدأوا الدردشة':'تابعك بالمقابل، صار بإمكانكم الدردشة 💬'}<br><small class="mu">${ago(n.ts)}</small></div></div>`).join('')||'<p class="mu">لا توجد إشعارات</p>');badges()},
 async chats(){const l=await api('/chats');$('#v').innerHTML='<h3 class="ttl">الدردشات</h3>'+(l.map(c=>`<div class="card row" onclick="go('chat',${c.user.id})">${av(c.user)}<div class="fx"><b>${esc(c.user.username)}</b><br><small class="mu">${esc(c.last||'ابدأ المحادثة')}</small></div><i class="bd">${c.unread||''}</i></div>`).join('')||'<p class="mu">تابع شخصاً ويتابعك بالمقابل لتظهر الدردشة هنا</p>')},
 async chat(id){CH=id;CU=await api('/uid/'+id);
  $('#v').innerHTML=`<div class="ch"><div class="card row chh" onclick="opts()">${av(CU)}<b class="fx">${esc(CU.username)}</b><span class="mu">⋮</span></div><div id="ms"></div></div>
  <div class="bar"><label>📎<input type="file" id="cf" hidden onchange="sf()"></label><input id="ct" placeholder="اكتب رسالة..." onkeydown="if(event.key=='Enter')st()"><button id="mic" onclick="rec()">🎤</button><button onclick="st()">➤</button></div>`;
  const load=async()=>{if(V!='chat')return;const l=await api('/msg/'+id),b=$('#ms');if(!b)return;const bot=innerHeight+scrollY>=document.body.scrollHeight-120;
   b.innerHTML=l.map(m=>`<div class="m ${m.me?'me':''}">${m.deleted?'<i>🚫 تم حذف هذه الرسالة</i>':media(m.media,m.mtype)+(m.text?`<span>${esc(m.text)}</span>`:'')}<small>${ago(m.ts)}${m.edited?' · معدّلة':''}${m.me&&!m.deleted?` <u onclick="mo(${m.id},${!m.media},this)" data-t="${esc(m.text)}">⋯</u>`:''}</small></div>`).join('')||'<p class="mu">ابدأ المحادثة بإرسال رسالة</p>';
   if(bot)scrollTo(0,document.body.scrollHeight)};
  await load();scrollTo(0,document.body.scrollHeight);poll=setInterval(load,3000)}
};
/* ---- actions ---- */
async function pub(b){const f=new FormData();f.append('text',$('#pt').value);const x=$('#pf').files[0];if(x)f.append('file',x);b.disabled=true;b.textContent='جاري النشر...';
 try{await api('/posts',{method:'POST',body:f});go('home')}catch(e){alert(e.message);b.disabled=false;b.textContent='نشر'}}
async function like(id,b){const d=await api('/like/'+id,{method:'POST'});b.className=d.on?'lk':'';b.innerHTML=(d.on?'❤️':'🤍')+' <span>'+d.n+'</span>'}
async function cm(id){const c=$('#c'+id);if(c.innerHTML){c.innerHTML='';return}const l=await api('/comments/'+id);
 c.innerHTML=l.map(x=>`<p><b>${esc(x.user.username)}</b> ${esc(x.text)}</p>`).join('')+`<div class="in"><input id="ci${id}" placeholder="اكتب تعليق..."><button onclick="addc(${id})">إرسال</button></div>`}
async function addc(id){const i=$('#ci'+id);if(!i.value.trim())return;await api('/comments/'+id,{method:'POST',json:{text:i.value}});$('#c'+id).innerHTML='';cm(id)}
let sqt;function dq(){clearTimeout(sqt);sqt=setTimeout(async()=>{const s=$('#sq');if(!s)return;const v=s.value.trim(),b=$('#sr');
 if(!v){b.innerHTML='';return}const l=await api('/search?q='+encodeURIComponent(v));
 b.innerHTML=l.map(u=>`<div class="card row"><div class="row fx" onclick="go('profile','${u.username}')">${av(u)}<b>${esc(u.username)}</b></div><button class="${u.i_follow?'btn2':'btn'}" onclick="sfl(${u.id},this)">${u.i_follow?'إلغاء المتابعة':'متابعة'}</button></div>`).join('')||'<p class="mu">ما لقينا حدا بهذا الاسم</p>'},300)}
async function sfl(id,b){const d=await api('/follow/'+id,{method:'POST'});b.className=d.on?'btn2':'btn';b.textContent=d.on?'إلغاء المتابعة':'متابعة'}
async function fl(id,n){await api('/follow/'+id,{method:'POST'});go('profile',n)}
async function snd(f){try{await api('/msg/'+CH,{method:'POST',body:f});go('chat',CH)}catch(e){alert(e.message)}}
async function st(){const i=$('#ct');if(!i.value.trim())return;const f=new FormData();f.append('text',i.value);i.value='';snd(f)}
function sf(){const f=new FormData();f.append('file',$('#cf').files[0]);snd(f)}
async function rec(){if(mr&&mr.state=='recording')return mr.stop();
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);const ch=[];mr.ondataavailable=e=>ch.push(e.data);
  mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());const f=new FormData();f.append('file',new Blob(ch,{type:mr.mimeType}),'voice.'+(mr.mimeType.includes('mp4')?'m4a':'webm'));snd(f)};
  mr.start();$('#mic').textContent='⏹'}catch{alert('لازم تسمح باستخدام الميكروفون (ويحتاج الموقع https)')}}
function sheet(items){const d=document.createElement('div');d.className='sh';d.innerHTML='<div>'+items.map((x,i)=>`<button data-i="${i}">${x[0]}</button>`).join('')+'<button>إلغاء</button></div>';
 d.onclick=e=>{const i=e.target.dataset.i;d.remove();if(i!=null)items[i][1]()};document.body.append(d)}
function mo(id,txt,el){const old=el.dataset.t;sheet([...(txt?[['✏️ تعديل الرسالة',async()=>{const x=prompt('عدّل الرسالة',old);if(x&&x.trim()){await api('/msg/edit/'+id,{method:'POST',json:{text:x}});go('chat',CH)}}]]:[]),
 ['🗑️ حذف لدى الجميع',async()=>{await api('/msg/del/'+id,{method:'POST'});go('chat',CH)}]])}
function opts(){sheet([['👤 الملف الشخصي',()=>go('profile',CU.username)],
 ['🧹 حذف الدردشة',async()=>{if(confirm('حذف المحادثة من عندك؟')){await api('/chat/'+CH+'/clear',{method:'POST'});go('chat',CH)}}],
 [CU.blocked?'✅ إلغاء الحظر':'🚫 حظر المستخدم',async()=>{await api('/block/'+CH,{method:'POST'});go('chats')}]])}
boot();
</script>
</body>
                                                            </html>
