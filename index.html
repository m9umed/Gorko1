<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14111f;--sf:#1f1b2e;--tx:#f4f0e8;--mu:#9a94ad;--ac:#6ee7c8;--ac2:#a78bfa;--rd:#ff6b81}
*{box-sizing:border-box;margin:0;font-family:Tajawal,system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);max-width:480px;margin:auto;min-height:100vh;padding-bottom:64px}
a,button,label{cursor:pointer}input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--sf);border:1px solid #3a3452;border-radius:10px;padding:10px;width:100%;margin:5px 0}
button{background:var(--ac);color:#14111f;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
button.g{background:var(--sf);color:var(--tx);border:1px solid #3a3452}button.d{background:var(--rd);color:#fff}
.logo{font-size:44px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
#au{padding:60px 24px;text-align:center}#au p{color:var(--mu);margin:10px 0}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
header .logo{font-size:28px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;background:var(--sf);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav b{flex:1;text-align:center;padding:14px 0;font-size:20px;opacity:.5;cursor:pointer}nav b.on{opacity:1}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-weight:800;color:#14111f;flex:none}
.h{display:flex;align-items:center;gap:10px;padding:8px 12px}.sp{flex:1}
.card{margin-bottom:18px}.card img,.card video{width:100%;max-height:560px;object-fit:cover;display:block;background:#000}
.ac{padding:8px 12px;display:flex;gap:14px;align-items:center}.card p{padding:0 12px}
.stl{display:flex;gap:12px;overflow-x:auto;padding:8px 12px}.stl div{text-align:center;font-size:12px;flex:none;cursor:pointer}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:inline-block}.ring .av{border:3px solid var(--bg);width:58px;height:58px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.grid .t{aspect-ratio:1;background:var(--sf);padding:8px;font-size:13px;overflow:hidden;cursor:pointer}
.pf{padding:14px}.pf .av{width:84px;height:84px;font-size:32px}.cnt{display:flex;gap:22px;margin:10px 0;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#reels{height:calc(100vh - 56px);overflow-y:scroll;scroll-snap-type:y mandatory}
.rl{height:calc(100vh - 56px);scroll-snap-align:start;position:relative;background:#000}
.rl video{width:100%;height:100%;object-fit:cover}
.rl .ov{position:absolute;bottom:14px;right:12px;left:70px;text-shadow:0 1px 4px #000}
.rl .sd{position:absolute;bottom:20px;left:12px;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:24px;text-shadow:0 1px 4px #000}
.mdw{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:100%;max-width:480px;max-height:85vh;overflow:auto;padding:16px;border-radius:18px 18px 0 0}
.st-v{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center}.st-v img,.st-v video{max-width:100%;max-height:100%}
.st-v .tp{position:absolute;top:14px;right:14px;left:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}.li small{color:var(--mu);display:block}
.ch{display:flex;flex-direction:column;height:calc(100vh - 64px)}#ms{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--sf);align-self:flex-start;word-break:break-word}.m.me{background:#2d6b5e;align-self:flex-end}
.m img,.m video{max-width:100%;border-radius:10px;margin-bottom:4px}.m small{display:block;color:#ffffff99;font-size:11px;margin-top:2px}.m a{margin-inline-end:8px}
.in{display:flex;gap:6px;padding:8px;align-items:center}.in input{margin:0}
.ad{padding:14px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}
.ar{background:var(--sf);border-radius:12px;padding:12px;margin-bottom:8px}.ar small{color:var(--mu);display:block;margin:2px 0}
.big{font-size:38px;font-weight:800;color:var(--ac)}.e{text-align:center;color:var(--mu);padding:40px}
body.light{--bg:#f6f3ec;--sf:#fff;--tx:#1b1726;--mu:#6b6580;--ac:#12a58a}.m.me{color:#fff}
*{-webkit-tap-highlight-color:rgba(110,231,200,.35)}
a:active,.li:active,nav b:active,.stl div:active{background:rgba(110,231,200,.22);border-radius:10px}
button:active{filter:brightness(.8);transform:scale(.96)}
.av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac2),0 6px 14px #0004}
.dot{position:relative}.dot::after{content:'';position:absolute;top:4px;left:calc(50% + 6px);width:11px;height:11px;border-radius:50%;background:#ff3b4e;border:2px solid var(--bg)}
.rp{position:absolute;bottom:16px;left:12px;right:12px;display:flex;gap:8px;align-items:center;font-size:26px}.rp input{margin:0}
</style></head><body>
<div id="app"></div><div id="ov"></div>
<script>
let T=localStorage.t,ME=null,poll=null,cur='home',adT=null;
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(a,d={})=>{try{const r=await(await fetch('/api',{method:'POST',body:JSON.stringify({a,t:T,...d})})).json();if(r.err){if(r.err=='auth'){logout();return null}alert(r.err);return null}return r}catch(e){alert('تعذّر الاتصال بالسيرفر');return null}};
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const av=u=>u.av?`<img class=av src="${u.av}">`:`<div class=av>${E(u.name[0]).toUpperCase()}</div>`;
const med=p=>!p.media?'':p.mt=='v'?`<video src="${p.media}" controls playsinline></video>`:`<img src="${p.media}">`;
const tm=t=>new Date(t*1000).toLocaleString('ar',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
function modal(h){$('#ov').innerHTML=`<div class=mdw onclick="if(event.target==this)closeM()"><div class=md>${h}</div></div>`}
function closeM(){$('#ov').innerHTML=''}
const stat=t=>t?(Date.now()/1000-t<60?'🟢 متصل الآن':'آخر ظهور '+tm(t)):'';
let BT;async function bdg(){if(!T||!$('#dm'))return;const r=await fetch('/api',{method:'POST',body:JSON.stringify({a:'badge',t:T})}).then(x=>x.json()).catch(()=>0);if(!r||r.err)return;$('#dm').classList.toggle('dot',r.m>0);$('#nb').classList.toggle('dot',r.n>0)}
function theme(){document.body.classList.toggle('light');localStorage.th=document.body.classList.contains('light')?1:''}
if(localStorage.th)document.body.classList.add('light');
function logout(){localStorage.removeItem('t');T=null;ME=null;clearInterval(poll);clearInterval(adT);clearInterval(BT);authV()}

/* ---------- auth ---------- */
function authV(reg){$('#app').innerHTML=`<div id=au><div class=logo>Mi</div><p>${reg?'إنشاء حساب جديد':'شارك لحظاتك مع من تحب'}</p>
${reg?`<label style="display:inline-block"><div id=pv class=av style="width:84px;height:84px;font-size:30px;margin:auto">📷</div><input type=file id=rf accept="image/*" hidden onchange="pvw(this)"></label><input id=dn placeholder="اسم الحساب (الاسم الظاهر)">`:''}
<input id=un placeholder="اسم المستخدم" autocapitalize=off><input id=pw type=password placeholder="كلمة المرور">${reg?`<input id=pw2 type=password placeholder="تأكيد كلمة المرور">`:''}
<div class=row style="justify-content:center">${reg?`<button onclick="go('reg')">إنشاء الحساب</button><button class=g onclick="authV()">لدي حساب</button>`:`<button onclick="go('login')">تسجيل الدخول</button><button class=g onclick="authV(1)">إنشاء حساب</button>`}</div></div>`}
async function pvw(i){const f=i.files[0];if(f)$('#pv').innerHTML=`<img class=av style="width:84px;height:84px;box-shadow:none" src="${await rd(f)}">`}
async function go(a){const d={name:$('#un').value.trim(),pw:$('#pw').value};if(a=='reg'){if(d.pw!=$('#pw2').value)return alert('كلمتا المرور غير متطابقتين');d.dn=$('#dn').value.trim();const f=$('#rf').files[0];if(f)d.av=await rd(f)}const r=await api(a,d);if(!r)return;T=r.t;localStorage.t=T;if(r.admin){adminV();return}ME=r.me;main()}

/* ---------- main shell ---------- */
function main(){$('#app').innerHTML=`<header><div class=logo>Mi</div><span><a onclick="theme()" style="font-size:22px">🌓</a> <a id=nb onclick="show('notifs')" style="font-size:22px">🔔</a></span></header><div id=v></div>
<nav><b data-t=home onclick="show('home')">🏠</b><b data-t=search onclick="show('search')">🔍</b><b onclick="newM()">➕</b><b data-t=reels onclick="show('reels')">🎬</b><b id=dm data-t=chats onclick="show('chats')">💬</b><b data-t=me onclick="show('me')">👤</b></nav>`;show('home');bdg();clearInterval(BT);BT=setInterval(bdg,5000)}
function show(t){cur=t;clearInterval(poll);document.querySelectorAll('nav b').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
({home:homeV,search:searchV,reels:reelsV,chats:chatsV,me:()=>prof(ME.id),notifs:notifV})[t]()}

/* ---------- feed / stories / posts ---------- */
const card=p=>`<div class=card><div class=h onclick="prof(${p.u})">${av(p)}<b>${E(p.name)}</b><span class=sp></span>${p.u==ME.id?`<a onclick="event.stopPropagation();editPost(${p.id})">✏️</a><a onclick="event.stopPropagation();delPost(${p.id})">🗑</a>`:''}</div>${med(p)}
<div class=ac><a onclick="like(${p.id},this)">${p.liked?'❤️':'🤍'}</a><span>${p.likes}</span><a onclick="cmts(${p.id})">💬 ${p.cc}</a><a onclick="shr(${p.id})">📤</a></div>${p.txt?`<p><b>${E(p.name)}</b> ${E(p.txt)}</p>`:''}</div>`;
async function homeV(){const j=await api('feed');if(!j)return;const g={};j.stories.forEach(s=>(g[s.u]=g[s.u]||[]).unshift(s));window.SG=Object.values(g);
V().innerHTML=`<div class=stl>${SG.map((x,i)=>`<div onclick="story(${i})"><span class=ring>${av(x[0])}</span><br>${E(x[0].name)}</div>`).join('')}</div>`+(j.posts.map(card).join('')||`<div class=e>لا توجد منشورات بعد.<br>تابع أشخاصاً أو انشر أول منشور لك.</div>`)}
const V=()=>$('#v');
async function like(id,el){const r=await api('like',{p:id});if(!r)return;el.textContent=r.liked?'❤️':'🤍';el.nextElementSibling.textContent=r.likes}
async function delPost(id){if(confirm('حذف المنشور نهائياً؟')){await api('delpost',{id});show(cur)}}
async function editPost(id){const t=prompt('عدّل النص:');if(t!==null){await api('editpost',{id,txt:t});show(cur)}}
function story(i){const it=SG[i];let k=0;const w=document.createElement('div');w.className='st-v';
const draw=()=>{const s=it[k];w.innerHTML=`${s.mt=='v'?`<video src="${s.media}" autoplay playsinline></video>`:`<img src="${s.media}">`}<div class=tp><span style="color:#fff">${E(s.name)} · ${tm(s.ts)}</span><span>${s.u==ME.id?`<button class=g onclick="alert('👁 '+${s.vc}+' مشاهدة')" id=sv>👁 ${s.vc}</button> <button class=d id=sd>حذف</button> `:''}<button class=g id=sx>✕</button></span></div>${s.u==ME.id?'':`<div class=rp><input id=sr2 placeholder="رد على القصة..." onfocus="clearTimeout(tm_)"><button onclick="sRep(${s.u},$('#sr2').value)">إرسال</button><a onclick="sRep(${s.u},'❤️',1)">❤️</a><a onclick="sRep(${s.u},'😂',1)">😂</a><a onclick="sRep(${s.u},'🔥',1)">🔥</a></div>`}`;
$('#ov').appendChild(w);if(s.u!=ME.id)api('sview',{p:s.id});w.querySelector('#sx').onclick=()=>{w.remove();clearTimeout(tm_)};const d=w.querySelector('#sd');if(d)d.onclick=async()=>{await api('delpost',{id:s.id});w.remove();show('home')};
w.onclick=e=>{if(e.target.tagName=='IMG'||e.target.tagName=='VIDEO'){clearTimeout(tm_);if(++k<it.length)draw();else w.remove()}};clearTimeout(tm_);tm_=setTimeout(()=>{if(++k<it.length)draw();else w.remove()},s.mt=='v'?15000:5000)};let tm_;draw()}
async function cmts(p){RP=0;const r=await api('cmts',{p});if(!r)return;modal(`<h3>التعليقات</h3>${r.c.map(c=>`<div class=li style="padding:6px 0;margin-inline-start:${c.r?36:0}px">${av(c)}<div><b>${E(c.name)}</b> ${E(c.txt)}</div><span class=sp></span><a onclick="RP=${c.r||c.id};$('#ci').placeholder='رد على ${E(c.name)}...';$('#ci').focus()">↩️</a>${c.u==ME.id?`<a onclick="delC(${c.id},${p})">🗑</a>`:''}</div>`).join('')||'<div class=e>لا تعليقات</div>'}<div class=in><input id=ci placeholder="أضف تعليقاً..."><button onclick="addC(${p})">نشر</button></div>`)}
let RP=0;async function addC(p){const t=$('#ci').value;if(t.trim()){await api('comment',{p,txt:t,r:RP});RP=0;cmts(p)}}
async function sRep(o,t,e){if(!t.trim())return;const r=await api('send',{o,txt:(e?'تفاعل مع قصتك: ':'↩️ رد على قصتك: ')+t});if(r)alert('تم الإرسال ✅')}
async function shr(p){const r=await api('search',{q:''});if(r)modal(`<h3>مشاركة إلى</h3><input id=sq placeholder="بحث" oninput="shs(${p})"><div id=sl>${shl(r.us,p)}</div>`)}
const shl=(us,p)=>us.map(u=>`<div class=li onclick="doShr(${p},${u.id})">${av(u)}<b>${E(u.name)}</b></div>`).join('')||'<div class=e>لا نتائج</div>';
async function shs(p){const r=await api('search',{q:$('#sq').value});if(r)$('#sl').innerHTML=shl(r.us,p)}
async function doShr(p,o){const r=await api('send',{o,ref:p});if(r){closeM();alert('تمت المشاركة ✅')}}
async function delC(id,p){await api('delcmt',{id});cmts(p)}

/* ---------- create ---------- */
function newM(){modal(`<h3>إنشاء</h3><div class=row><button class=g onclick="K='post';$('#kd').textContent='منشور'">منشور</button><button class=g onclick="K='story';$('#kd').textContent='قصة'">قصة</button><button class=g onclick="K='reel';$('#kd').textContent='ريل (فيديو)'">ريل</button></div><p>النوع: <b id=kd>منشور</b></p>
<input type=file id=nf accept="image/*,video/*"><textarea id=nt rows=3 placeholder="اكتب شيئاً... (يمكن نشر نص فقط)"></textarea><button onclick="publish()" id=pb>نشر</button>`);K='post'}
let K='post';
async function publish(){const f=$('#nf').files[0];if(f&&f.size>50e6)return alert('الملف أكبر من 50MB');if(K=='reel'&&(!f||!f.type.startsWith('video')))return alert('الريل يجب أن يكون فيديو');
$('#pb').disabled=true;$('#pb').textContent='جارٍ الرفع...';const r=await api('new',{kind:K,media:f?await rd(f):'',txt:$('#nt').value});closeM();if(r)show(K=='reel'?'reels':'home')}

/* ---------- reels ---------- */
async function reelsV(){const j=await api('reels');if(!j)return;
V().innerHTML=`<div id=reels>${j.posts.map(p=>`<div class=rl><video src="${p.media}" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class=ov><b onclick="prof(${p.u})">@${E(p.name)}</b><br>${E(p.txt)}</div><div class=sd><a onclick="like(${p.id},this)">${p.liked?'❤️':'🤍'}</a><span>${p.likes}</span><a onclick="cmts(${p.id})">💬</a><span>${p.cc}</span><a onclick="shr(${p.id})">📤</a>${p.u==ME.id?`<a onclick="delPost(${p.id})">🗑</a>`:''}</div></div>`).join('')||'<div class=e>لا توجد ريلز بعد</div>'}</div>`;
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.7});document.querySelectorAll('.rl').forEach(x=>io.observe(x))}

/* ---------- search ---------- */
function searchV(){V().innerHTML=`<div style="padding:0 14px"><input id=q placeholder="ابحث عن أصدقاء..." oninput="doS()"></div><div id=sr></div>`}
async function doS(){const r=await api('search',{q:$('#q').value});if(r)$('#sr').innerHTML=r.us.map(u=>`<div class=li onclick="prof(${u.id})">${av(u)}<b>${E(u.name)}</b><span class=sp></span><small>${u.isf?'تتابعه':''}</small></div>`).join('')||'<div class=e>لا نتائج</div>'}

/* ---------- profile ---------- */
async function prof(id){const r=await api('profile',{id});if(!r)return;clearInterval(poll);const u=r.u,me=u.id==ME.id;
V().innerHTML=`<div class=pf><div class=h style="padding:0;gap:16px">${av(u)}<div class=cnt style="margin:0"><div><b>${r.posts.length}</b><br>منشور</div><div><b>${r.fers}</b><br>متابع</div><div><b>${r.fing}</b><br>يتابع</div></div></div>
<h3 style="margin-top:8px">${E(u.dn||u.name)}${u.priv?' 🔒':''}</h3><small style="color:var(--mu)">@${E(u.name)} · ${stat(u.seen)}</small><p>${E(u.bio)}</p><div class=row>${me?`<button onclick="editProf()">تعديل الملف</button><button class=g onclick="lists()">المحظورون والمحصورون</button><button class=g onclick="logout()">خروج</button>`:
`<button onclick="act('follow',${u.id})">${r.isf?'إلغاء المتابعة':r.isq?'إلغاء الطلب':'متابعة'}</button><button class=g onclick="chat(${u.id},'${E(u.name)}')">رسالة</button><button class=g onclick="act('restrict',${u.id})">${r.isr?'إلغاء التقييد':'تقييد'}</button><button class=d onclick="act('block',${u.id})">${r.isb?'إلغاء الحظر':'حظر'}</button>`}</div></div>
${r.lock?'<div class=e>🔒 هذا حساب خاص<br>تابعه لرؤية منشوراته</div>':''}<div class=grid>${r.posts.map(p=>p.mt=='v'?`<video src="${p.media}" onclick="one(${p.id})"></video>`:p.media?`<img src="${p.media}" onclick="one(${p.id})">`:`<div class=t onclick="one(${p.id})">${E(p.txt)}</div>`).join('')}</div>`;window.PP=r.posts}
async function act(a,id){await api(a,{id});prof(id)}
function one(id){const p=PP.find(x=>x.id==id);modal(card(p))}
function editProf(){modal(`<h3>تعديل الملف الشخصي</h3><input type=file id=ef accept="image/*"><input id=edn placeholder="اسم الحساب (الاسم الظاهر)"><input id=en value="${E(ME.name)}"><textarea id=eb rows=3 placeholder="نبذة عنك"></textarea><label><input type=checkbox id=ep style="width:auto"> 🔒 حساب خاص (لا يراسلك إلا من تقبل متابعته)</label><br><br><button onclick="saveProf()">حفظ</button>`);api('profile',{id:ME.id}).then(r=>{if(r){$('#eb').value=r.u.bio;$('#edn').value=r.u.dn||'';$('#ep').checked=!!r.u.priv}})}
async function saveProf(){const f=$('#ef').files[0],r=await api('editprofile',{name:$('#en').value,dn:$('#edn').value,priv:$('#ep').checked,bio:$('#eb').value,av:f?await rd(f):''});if(r){ME=r.me;closeM();prof(ME.id)}}
async function lists(){const r=await api('lists');const f=a=>a.map(u=>`<div class=li onclick="closeM();prof(${u.id})">${av(u)}<b>${E(u.name)}</b></div>`).join('')||'<div class=e>لا أحد</div>';modal(`<h3>الأشخاص المحظورون</h3>${f(r.bl)}<h3>الأشخاص المحصورون</h3>${f(r.rs)}`)}

/* ---------- notifications ---------- */
async function notifV(){const r=await api('notifs');V().innerHTML=`<h3 style="padding:0 14px">الإشعارات</h3>`+(r.n.map(n=>`<div class=li><div>${E(n.txt)}<small>${tm(n.ts)}</small></div>${n.k=='req'?`<span class=sp></span><button onclick="acc('accept',${n.x})">قبول</button><button class=g onclick="acc('decline',${n.x})">رفض</button>`:''}</div>`).join('')||'<div class=e>لا إشعارات</div>')}

async function acc(a,id){await api(a,{id});notifV()}
/* ---------- chats ---------- */
