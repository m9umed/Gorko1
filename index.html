<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلب جليدي 💙❄️</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e3a8a, #0f172a 45%, #020617 100%);
            --ice-glass: rgba(224, 242, 254, 0.08);
            --ice-glass-heavy: rgba(15, 23, 42, 0.72);
            --ice-border: rgba(186, 230, 253, 0.35);
            --ice-highlight: rgba(255, 255, 255, 0.18);
            --ice-accent: #38bdf8;
            --ice-cyan: #7dd3fc;
            --ice-glow: 0 0 20px rgba(56, 189, 248, 0.45), inset 0 0 12px rgba(255, 255, 255, 0.12);
            --text-main: #f0f9ff;
            --text-muted: #bae6fd;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* تأثير الثلج المتساقط في الخلفية */
        .snowflakes {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(224, 242, 254, 0.45);
            font-size: 1rem;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        /* شاشة تسجيل الدخول */
        #auth-screen {
            position: relative;
            z-index: 1;
            background: var(--ice-glass);
            backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid var(--ice-border);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            padding: 40px;
            border-radius: 28px;
            width: 90%;
            max-width: 410px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), var(--ice-glow);
        }

        .logo {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #ffffff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border-radius: 14px;
            border: 1px solid var(--ice-border);
            background: rgba(15, 23, 42, 0.55);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--ice-accent);
            box-shadow: var(--ice-glow);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--ice-glow);
        }

        /* واجهة التطبيق الرئيسية — شاشة كاملة */
        #app-screen {
            position: relative;
            z-index: 1;
            display: none;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: var(--ice-glass);
            backdrop-filter: blur(24px) saturate(150%);
            overflow: hidden;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 360px;
            flex-shrink: 0;
            border-left: 1px solid var(--ice-border);
            display: flex;
            flex-direction: column;
            background: rgba(9, 21, 38, 0.55);
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--ice-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--ice-accent);
            background: linear-gradient(135deg, #0ea5e9, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-box {
            padding: 14px;
            border-bottom: 1px solid var(--ice-border);
            display: flex;
            gap: 8px;
        }

        .search-box input { margin-bottom: 0; padding: 8px 12px; }
        .search-box button { width: auto; padding: 8px 16px; }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .user-item {
            padding: 11px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--ice-border);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }

        .add-btn {
            width: auto;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            display: flex;
            border-top: 1px solid var(--ice-border);
            background: rgba(6, 16, 30, 0.85);
            padding: 6px;
            gap: 6px;
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            box-shadow: none;
            padding: 8px 4px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-btn:hover { transform: none; background: rgba(255, 255, 255, 0.06); }
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.45), rgba(56, 189, 248, 0.25));
            border-color: var(--ice-border);
            color: #fff;
            box-shadow: var(--ice-glow);
        }

        /* قسم الحالات */
        .status-card {
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .status-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-word;
        }
        .color-picker-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.selected { border-color: #fff; transform: scale(1.15); }

        /* منطقة المحادثة */
        .chat-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.25);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--ice-border);
            background: rgba(9, 21, 38, 0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .chat-who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .chat-who strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* زر الرجوع (يظهر على الجوال فقط) */
        .back-btn {
            display: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.3rem;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--ice-border);
            box-shadow: none;
        }
        .back-btn:hover { transform: none; }

        /* من شاهد الحالة */
        .viewers-btn {
            width: auto;
            margin-top: 10px;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }
        .viewers-list {
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 4px 12px;
        }
        .viewer-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 0.85rem; }

        /* عرض الصورة الشخصية بحجم كبير */
        #avatar-viewer {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 100;
            background: rgba(2, 6, 23, 0.92);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #avatar-viewer-img { border-width: 3px; }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .action-pill {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--ice-border);
            box-shadow: none;
        }
        .action-pill.danger { color: #fca5a5; border-color: rgba(248, 113, 113, 0.4); }
        .action-pill.danger:hover { background: rgba(239, 68, 68, 0.25); }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 72%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.45;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .msg.sent {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.85), rgba(56, 189, 248, 0.75));
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
        }

        .msg.received {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--ice-border);
            border-bottom-left-radius: 4px;
        }

        .msg.deleted {
            font-style: italic;
            opacity: 0.65;
            background: rgba(15, 23, 42, 0.5);
        }

        .msg-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            margin-top: 4px;
            color: rgba(240, 249, 255, 0.85);
        }

        .read-badge { color: #e0f2fe; font-weight: 700; text-shadow: 0 0 6px #fff; }

        .msg-menu-btn {
            position: absolute;
            top: 6px;
            left: 8px;
            background: rgba(0, 0, 0, 0.25);
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.75rem;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }

        .msg.sent:not(.deleted):hover .msg-menu-btn { display: flex; }

        .msg-dropdown {
            position: absolute;
            top: 30px;
            left: 8px;
            background: rgba(9, 21, 38, 0.95);
            border: 1px solid var(--ice-border);
            border-radius: 12px;
            padding: 4px;
            z-index: 20;
            min-width: 135px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .msg-dropdown div {
            padding: 7px 10px;
            font-size: 0.82rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .msg-dropdown div:hover { background: rgba(56, 189, 248, 0.25); }

        .chat-input-area {
            padding: 14px 20px;
            border-top: 1px solid var(--ice-border);
            display: flex;
            gap: 10px;
            background: rgba(9, 21, 38, 0.5);
        }
        .chat-input-area input { margin-bottom: 0; }
        .chat-input-area button { width: 110px; }

        .section-title {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 8px 4px;
            font-weight: 700;
        }

        @media (hover: none) {
            .msg.sent:not(.deleted) .msg-menu-btn { display: flex; }
        }
        body { height: 100vh; height: 100dvh; }

        /* الجوال: قائمة الدردشات بشاشة كاملة، وعند الضغط على دردشة تُفتح بشاشة كاملة */
        @media (max-width: 900px) {
            .sidebar { width: 100%; border-left: none; }
            .chat-area { display: none; width: 100%; }
            #app-screen.in-chat .sidebar { display: none; }
            #app-screen.in-chat .chat-area { display: flex; }
            .back-btn { display: flex; }
            .msg { max-width: 82%; }
            .chat-input-area { padding: 10px 12px; }
            .chat-input-area button { width: 96px; }
            .messages-box { padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="snowflakes" id="snow-container"></div>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen">
        <div class="logo">قلب جليدي 💙❄️</div>
        <p class="subtitle">أدخل اسم المستخدم وكلمة المرور للدخول إلى عالم الجليد</p>
        <input type="text" id="username-input" placeholder="اسم المستخدم...">
        <input type="password" id="password-input" placeholder="كلمة المرور...">
        <button id="login-btn" onclick="login()">دخول ❄️</button>
        <p id="auth-error" style="color: #fca5a5; margin-top: 12px; font-size: 0.9rem;"></p>
        <p style="margin-top: 10px; font-size: 0.7rem; opacity: 0.5;">نسخة 3</p>
    </div>

    <!-- واجهة التطبيق -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <span style="font-weight: 800; font-size: 1.1rem;">قلب جليدي 💙</span>
                <div class="user-profile-mini">
                    <span id="current-user-badge" style="color: var(--ice-cyan); font-size: 0.9rem; font-weight: 600;"></span>
                    <div id="my-header-avatar" class="avatar" style="width: 34px; height: 34px; font-size: 0.85rem; cursor: pointer;" onclick="showAvatarBig(currentUser, currentAvatar)"></div>
                </div>
            </div>

            <!-- 1. تبويب الأصدقاء -->
            <div id="tab-friends" class="tab-content">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="ابحث عن صديق بالاسم...">
                    <button onclick="searchUsers()">بحث</button>
                </div>
                <div class="list-container">
                    <div id="search-results-section" style="display: none;">
                        <div class="section-title">نتائج البحث:</div>
                        <div id="search-results"></div>
                    </div>
                    <div class="section-title">الأصدقاء:</div>
                    <div id="friends-list"></div>
                </div>
            </div>

            <!-- 2. تبويب الحالات (24 ساعة) -->
            <div id="tab-statuses" class="tab-content" style="display: none;">
                <div class="list-container">
                    <div class="section-title">أضف حالة نصية (تختفي بعد 24 ساعة) ❄️</div>
                    <textarea id="status-input" rows="2" placeholder="اكتب حالتك الجليدية هنا..."></textarea>
                    <div class="color-picker-row">
                        <div class="color-dot selected" style="background: linear-gradient(135deg, #0284c7, #1e3a8a);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #0284c7, #1e3a8a)')"></div>
                        <div class="color-dot" style="background: linear-gradient(135deg, #0f766e, #0e7490);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #0f766e, #0e7490)')"></div>
                        <div class="color-dot" style="background: linear-gradient(135deg, #4338ca, #312e81);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #4338ca, #312e81)')"></div>
                        <div class="color-dot" style="background: linear-gradient(135deg, #1e293b, #334155);" onclick="selectStatusBg(this, 'linear-gradient(135deg, #1e293b, #334155)')"></div>
                    </div>
                    <button onclick="postStatus()" style="margin-bottom: 16px;">نشر الحالة ✨</button>
                    <div class="section-title">حالات الجميع:</div>
                    <div id="statuses-list"></div>
                </div>
            </div>

            <!-- 3. تبويب الإعدادات -->
            <div id="tab-settings" class="tab-content" style="display: none;">
                <div class="list-container">
                    <div class="section-title">إعدادات الحساب الجليدي ⚙️</div>
                    <div style="text-align: center; margin: 15px 0;">
                        <div id="settings-avatar-preview" class="avatar" style="width: 80px; height: 80px; font-size: 1.8rem; margin: 0 auto 10px;"></div>
                        <label style="display: inline-block; padding: 6px 14px; background: rgba(56, 189, 248, 0.2); border: 1px solid var(--ice-border); border-radius: 10px; cursor: pointer; font-size: 0.85rem;">
                            تغيير صورة الحساب ?
